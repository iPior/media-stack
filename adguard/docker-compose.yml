services:
  adguard:
    image: adguard/adguardhome:latest
    container_name: adguard
    restart: unless-stopped
    ports:
      - "${ADGUARD_LAN_IP:?Set ADGUARD_LAN_IP in .env}:53:53/tcp"
      - "${ADGUARD_LAN_IP:?Set ADGUARD_LAN_IP in .env}:53:53/udp"
      - "${ADGUARD_TAILSCALE_IP:?Set ADGUARD_TAILSCALE_IP in .env}:53:53/tcp"
      - "${ADGUARD_TAILSCALE_IP:?Set ADGUARD_TAILSCALE_IP in .env}:53:53/udp"
      - "${ADGUARD_TAILSCALE_IP:?Set ADGUARD_TAILSCALE_IP in .env}:3001:3000/tcp" # Initial setup
      - "${ADGUARD_TAILSCALE_IP:?Set ADGUARD_TAILSCALE_IP in .env}:8081:80/tcp" # Admin interface after setup
    volumes:
      - ./work:/opt/adguardhome/work
      - ./conf:/opt/adguardhome/conf
